# Unit tests and end-to-end tests on Linux and on real Windows.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx vite build
      - run: npm test
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 && xvfb-run -a npm run e2e
      - name: End-to-end (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
